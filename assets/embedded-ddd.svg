<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">embedded-ddd — Deploy, Diagnostics, Debug</title>
  <desc id="description">Three connected stages of embedded development: deploy a build, diagnose its behavior, debug the cause, then verify the fix on the device.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#334155" stroke-opacity=".22"/>
    </pattern>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101b2d"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <marker id="return" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8" fill="none" stroke="#7b8ba5" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="418" rx="24" fill="url(#background)" stroke="#28354a"/>
  <rect x="24" y="24" width="1152" height="372" rx="12" fill="url(#grid)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="63" fill="#9bacc6" font-size="13" font-weight="700" letter-spacing="3">EMBEDDED LINUX / AGENT SKILLS</text>
    <text x="52" y="156" fill="#f1f5f9" font-size="76" font-weight="700" letter-spacing="-3">embedded-<tspan fill="#bef264">d</tspan><tspan fill="#67e8f9">d</tspan><tspan fill="#c4b5fd">d</tspan></text>
    <text x="56" y="202" fill="#c6d2e3" font-size="23">From the build to the board. From the symptom to the cause.</text>

    <g fill="none" stroke-width="1.5">
      <path d="M903 84H1058V176H981V153" stroke="#465571"/>
      <path d="M957 176H903V108" stroke="#465571"/>
      <path d="M870 84H849M1058 59V44M1083 84H1113M981 201V219" stroke="#334760"/>
      <rect x="879" y="60" width="48" height="48" rx="12" fill="#172a26" stroke="#8db749"/>
      <rect x="1034" y="60" width="48" height="48" rx="12" fill="#132936" stroke="#4eabbc"/>
      <rect x="957" y="152" width="48" height="48" rx="12" fill="#27233d" stroke="#9082bc"/>
      <path d="M1004 79L1009 84L1004 89" stroke="#67e8f9"/>
      <path d="M909 123L903 117L897 123" stroke="#bef264"/>
      <path d="M1020 181L1015 176L1020 171" stroke="#c4b5fd"/>
    </g>
    <g font-size="25" font-weight="700" text-anchor="middle">
      <text x="903" y="93" fill="#bef264">D</text>
      <text x="1058" y="93" fill="#67e8f9">D</text>
      <text x="981" y="185" fill="#c4b5fd">D</text>
    </g>

    <path d="M56 262H396" stroke="#bef264" stroke-width="3"/>
    <path d="M436 262H776" stroke="#67e8f9" stroke-width="3"/>
    <path d="M816 262H1144" stroke="#c4b5fd" stroke-width="3"/>
    <g font-size="14" font-family="'DejaVu Sans Mono', Consolas, monospace" fill="#8294b0">
      <text x="56" y="301">01</text>
      <text x="436" y="301">02</text>
      <text x="816" y="301">03</text>
    </g>
    <g font-size="27" font-weight="700" fill="#f1f5f9">
      <text x="94" y="302">Deploy</text>
      <text x="474" y="302">Diagnostics</text>
      <text x="854" y="302">Debug</text>
    </g>
    <g font-size="17" fill="#a9bad0">
      <text x="56" y="337">Install · observe · verify</text>
      <text x="436" y="337">Logs · state · evidence</text>
      <text x="816" y="337">Stacks · breakpoints · cores</text>
    </g>
    <path d="M1115 360V383H73V360" fill="none" stroke="#65758e" stroke-width="1.3" marker-end="url(#return)"/>
    <rect x="419" y="370" width="362" height="26" rx="13" fill="#0d1524"/>
    <text x="600" y="388" text-anchor="middle" fill="#91a4be" font-size="12" font-weight="700" letter-spacing="2.5">FIX · REDEPLOY · VERIFY</text>
  </g>
</svg>
