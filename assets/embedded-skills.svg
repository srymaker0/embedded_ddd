<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">embedded-skills — reusable skills for embedded development</title>
  <desc id="description">Build and test with project tools. Deploy, Diagnostics and Debug form the DDD device workflow. Current skills support embedded Linux.</desc>
